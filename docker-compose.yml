# 知枢星图一键容器化：后端 uvicorn + 前端 nginx，SQLite/FAISS 落命名卷
# 使用前先准备 backend/.env（参考 backend/.env.example），密钥只走环境变量，不进镜像。
# 项目名显式指定：否则 compose 会拿目录名（中文）当项目名而报错。
name: zhishu

services:
  backend:
    build: .
    env_file:
      - backend/.env
    environment:
      # .env 里的 FAISS_INDEX_PATH 是本机 Windows 路径（C:/temp/...），
      # 容器内会落到 /app/C:/temp 这种不存在的层级且不进命名卷，故覆盖到卷内。
      FAISS_INDEX_PATH: /app/data/faiss
    ports:
      - "8000:8000"
    volumes:
      - zhishu-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  zhishu-data:
